<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="268" viewBox="0 0 1200 268" role="img" aria-labelledby="modes-title modes-desc">
  <title id="modes-title">三种部署模式：standalone、CP（Raft）、AP（Distro）</title>
  <desc id="modes-desc">standalone 为单机本地日志与快照；CP 为三节点 Raft 集群，leader 向 follower 复制日志并多数派提交；AP 为三节点全量副本，分片 owner 写、异步复制与周期校验。</desc>

  <defs>
    <marker id="modes-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#58A6FF"/>
    </marker>
  </defs>

  <rect width="1200" height="268" rx="20" fill="#0B0F14"/>
  <rect x="1" y="1" width="1198" height="266" rx="19" fill="none" stroke="#1F2630" stroke-width="1.5"/>
  <text x="48" y="44" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17" letter-spacing="2.6" fill="#7D8590">THREE DEPLOYMENT MODES</text>

  <!-- standalone -->
  <g id="mode-standalone">
    <rect x="48" y="64" width="352" height="180" rx="12" fill="#0D1218" stroke="#1F2630"/>
    <text x="72" y="102" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="24" font-weight="700" fill="#E6EDF3">standalone</text>
    <text x="72" y="132" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="18" fill="#7D8590">单机 · 本地即真相</text>
    <rect x="152" y="150" width="144" height="48" rx="8" fill="#101820" stroke="#2A323D"/>
    <text x="224" y="181" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="20" fill="#E6EDF3">node-1</text>
    <text x="224" y="234" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" fill="#7D8590">WAL + 快照</text>
  </g>

  <!-- CP -->
  <g id="mode-cp">
    <rect x="424" y="64" width="352" height="180" rx="12" fill="#0D1218" stroke="#1F2630"/>
    <text x="448" y="102" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="24" font-weight="700" fill="#E6EDF3">CP · Raft</text>
    <text x="448" y="132" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="18" fill="#7D8590">多数派提交 · 线性读</text>

    <path d="M582 173 L556 190" fill="none" stroke="#58A6FF" stroke-width="1.5" marker-end="url(#modes-arrow)"/>
    <path d="M618 173 L644 190" fill="none" stroke="#58A6FF" stroke-width="1.5" marker-end="url(#modes-arrow)"/>
    <circle cx="600" cy="160" r="22" fill="#101820" stroke="#3FB950" stroke-width="1.5"/>
    <text x="600" y="166" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" fill="#3FB950">n1</text>
    <circle cx="536" cy="204" r="22" fill="#101820" stroke="#2A323D"/>
    <text x="536" y="210" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" fill="#C9D1D9">n2</text>
    <circle cx="664" cy="204" r="22" fill="#101820" stroke="#2A323D"/>
    <text x="664" y="210" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" fill="#C9D1D9">n3</text>
    <text x="600" y="234" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" fill="#7D8590">term · commit</text>
  </g>

  <!-- AP -->
  <g id="mode-ap">
    <rect x="800" y="64" width="352" height="180" rx="12" fill="#0D1218" stroke="#1F2630"/>
    <text x="824" y="102" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="24" font-weight="700" fill="#E6EDF3">AP · Distro</text>
    <text x="824" y="132" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="18" fill="#7D8590">异步复制 · 周期校验</text>

    <path d="M958 173 L932 190" fill="none" stroke="#58A6FF" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#modes-arrow)"/>
    <path d="M994 173 L1020 190" fill="none" stroke="#58A6FF" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#modes-arrow)"/>
    <circle cx="976" cy="160" r="22" fill="#101820" stroke="#58A6FF" stroke-width="1.5"/>
    <text x="976" y="166" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" fill="#58A6FF">n1</text>
    <circle cx="912" cy="204" r="22" fill="#101820" stroke="#2A323D"/>
    <text x="912" y="210" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" fill="#C9D1D9">n2</text>
    <circle cx="1040" cy="204" r="22" fill="#101820" stroke="#2A323D"/>
    <text x="1040" y="210" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" fill="#C9D1D9">n3</text>
    <text x="976" y="234" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" fill="#7D8590">owner · replica · verify</text>
  </g>
</svg>
